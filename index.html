<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="_YOAy_AEyG-iGjPNDBpKr8kwypVn4lToxQsD3rpK5jY">
<meta http-equiv="refresh" content="0; url=https://www.williamjstribling.com/">
<title>William J. Stribling</title>
<link rel="canonical" href="https://www.williamjstribling.com/">
<script>
  (function () {
    var base = 'https://www.williamjstribling.com';
    var path = window.location.pathname + window.location.search + window.location.hash;
    window.location.replace(base + (path === '/' ? '' : path));
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  :root{--paper:#F4F1EA;--ink:#1C1B18;--muted:#6F6A60;--rule:#D8D2C6;--accent:#9B3B26}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
       font-family:'Newsreader',Georgia,serif;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{max-width:34em;display:flex;flex-direction:column;gap:20px;text-align:center}
  .lab{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.12em;
       text-transform:uppercase;color:var(--muted)}
  h1{margin:0;font-size:clamp(28px,4vw,42px);font-weight:300;letter-spacing:-.02em;line-height:1.15}
  p{margin:0;font-size:18px;line-height:1.6;color:var(--muted)}
  a{color:inherit;border-bottom:1px solid var(--rule);text-decoration:none}
  a:hover{color:var(--accent)}
</style>
</head>
<body>
  <div class="box">
    <span class="lab">Redirecting</span>
    <h1>William J. Stribling</h1>
    <p>This site now lives at <a href="https://www.williamjstribling.com/">williamjstribling.com</a>.</p>
  </div>
</body>
</html>
